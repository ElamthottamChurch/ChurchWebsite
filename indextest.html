<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook Post Embed</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 2rem;
      background-color: #f9f9f9;
      text-align: center;
    }

    h1 {
      color: #1877f2;
    }

    .fb-post-container {
      max-width: 600px;
      margin: auto;
      background: #fff;
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  <h1>Embedded Facebook Post</h1>

  <div class="fb-post-container">
    <!-- Facebook Post Embed -->
    <iframe src="https://www.facebook.com/plugins/post.php?href=https%3A%2F%2Fwww.facebook.com%2Fpermalink.php%3Fstory_fbid%3Dpfbid0348wtkNHmDaj5TRQ6fdX3k8c4v8R6e6AXj1Mswuutu8PFjvVcezamRvLNzmZx7Dyul%26id%3D100005336055417&show_text=true&width=500"
            width="500" 
            height="250" 
            style="border:none;overflow:hidden" 
            scrolling="yes" 
            frameborder="0" 
            allowfullscreen="true" 
            allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share">
    </iframe>
  </div>

  <iframe
  src="https://www.facebook.com/plugins/post.php?href=https%3A%2F%2Fwww.facebook.com%2Fpermalink.php%3Fstory_fbid%3Dpfbid02QwitFiVG1aVGRBVyZ1qHszcd94WRrH7RsduPNW3zUFbjXWpaLFU5Me7W185trL1Kl%26id%3D100005336055417&show_text=true&width=500"
  width="500"
  height="600"
  style="border:none;overflow:hidden"
  scrolling="no"
  frameborder="0"
  allowfullscreen="true"
  allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share">
</iframe>

</body>
</html>
